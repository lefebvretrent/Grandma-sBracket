# Runs on every pull request and on every push to main: lint, type-check,
# and the test suite (including whole brackets played against a throwaway
# Postgres database that exists only for this run).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bracket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # All throwaway values. Nothing here points at the real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bracket_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bracket_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bracket_test
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create the database tables
        run: npx prisma migrate deploy

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
